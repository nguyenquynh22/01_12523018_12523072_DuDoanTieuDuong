services:
  backend:
    build: ${BACKEND_BUILD_CONTEXT:-./app/backend}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_CONTAINER_PORT:-8000}"
    environment:
      PORT: ${BACKEND_CONTAINER_PORT:-8000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:${AI_SERVICE_CONTAINER_PORT:-8001}}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-diabetes_db}
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ${FRONTEND_BUILD_CONTEXT:-./app/frontend}
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network
    restart: unless-stopped

  ai-service:
    build: ${AI_MODELS_BUILD_CONTEXT:-./ai-models}
    ports:
      - "${AI_SERVICE_PORT:-8001}:${AI_SERVICE_CONTAINER_PORT:-8001}"
    volumes:
      - ${AI_MODELS_HOST_PATH:-./ai-models/models}:/app/models
    environment:
      PORT: ${AI_SERVICE_CONTAINER_PORT:-8001}
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ${NGINX_CONFIG_HOST_PATH:-./nginx/default.conf.template}:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_SERVICE_HOST: ${BACKEND_SERVICE_HOST:-backend}
      BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8000}
      FRONTEND_SERVICE_HOST: ${FRONTEND_SERVICE_HOST:-frontend}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-80}
      AI_SERVICE_HOST: ${AI_SERVICE_HOST:-ai-service}
      AI_SERVICE_CONTAINER_PORT: ${AI_SERVICE_CONTAINER_PORT:-8001}
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
