services:
  ai-service:
    build: ./ai-models
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./app/backend
    ports: ["8000:8000"]
    environment:
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - API_URL=${API_URL}
      - MONGODB_URI=${MONGODB_URI}
    depends_on:
      ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: ${API_URL}
    ports: ["3000:80"]
    depends_on: [backend]