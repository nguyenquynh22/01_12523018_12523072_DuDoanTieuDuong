
services:
  # --- 1. BACKEND ---
  backend:
    build: ./app/backend
    ports:
      - "8000:8000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8001
      - MONGODB_URI=mongodb+srv://quynhng827:i53OJDqLc39CDSWI@cluster0.kflvoko.mongodb.net/diabetes_db?retryWrites=true&w=majority&connectTimeoutMS=30000&socketTimeoutMS=30000
    networks:
      - app-network

  # --- 2. FRONTEND ---
  frontend:
    build: ./app/frontend    
    ports:
      - "3000:3000"
    networks:
      - app-network


  ai-service:
    build: ./ai-models
    ports:
      - "8001:8001"
    volumes:
      - ./ai-models:/code   # Sửa từ ./app/ai-service thành ./ai-models
    environment:
      - PORT=8001
    networks:
      - app-network         # Thêm dòng này để backend có thể gọi được ai-service
    restart: always

  # --- 3. NGINX ---
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge