services:
  - type: web
    name: diabetes-ai-service
    runtime: python
    rootDir: ai-models
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    plan: free

  - type: web
    name: diabetes-backend
    runtime: python
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    plan: free
    envVars:
      - key: AI_SERVICE_URL
        value: https://diabetes-ai-service.onrender.com
      - key: API_URL
        value: https://diabetes-backend.onrender.com
