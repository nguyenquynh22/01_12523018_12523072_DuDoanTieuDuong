server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:80;
    set $ai_upstream ai-service:8001;

    # 1. Định tuyến toàn bộ các request bắt đầu bằng /api/ trực tiếp về Backend (cổng 8000)
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://$backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Định tuyến phần còn lại (Giao diện trang web) cho Frontend (Sửa lại thành cổng 3000)
    location / {
        proxy_pass http://$frontend_upstream;  
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Hỗ trợ WebSocket / Hot-reload cho Frontend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /ai-api/ {
        proxy_pass http://$ai_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}